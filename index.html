<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inventaris dan Penjualan</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📦%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#f4f6f9;--sf:#fff;--tx:#1b2330;--mu:#667085;--bd:#dfe4ea;--pr:#1d62c9;--pt:#fff;--ok:#16794a;--er:#c0392b;--wn:#a86a0c;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11151b;--sf:#1a2029;--tx:#e8ecf2;--mu:#98a2b3;--bd:#2c3542;--pr:#5b9bf5;--pt:#0b1220;--ok:#4cc38a;--er:#ff7b6b;--wn:#e8b04a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11151b;--sf:#1a2029;--tx:#e8ecf2;--mu:#98a2b3;--bd:#2c3542;--pr:#5b9bf5;--pt:#0b1220;--ok:#4cc38a;--er:#ff7b6b;--wn:#e8b04a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:14px 16px 6px;font-weight:700;font-size:18px}
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--bd)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
nav{display:flex;gap:6px;overflow-x:auto;padding:6px 16px 10px}
nav button{white-space:nowrap}
main{max-width:980px;margin:0 auto;padding:0 16px 40px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
h2{font-size:16px;margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:12px}
.kpi b{display:block;font-size:24px}.kpi span{color:var(--mu);font-size:13px}
button.kpi{text-align:left;width:100%;display:block;min-height:0}
#fw{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--th,96px) + var(--bt,0px));z-index:4;background:var(--bg);padding:10px 0 4px}
#fw .card{margin-bottom:10px;padding:0}

.fh{width:100%;display:flex;justify-content:space-between;align-items:center;border:0;background:none;font-weight:700;font-size:16px;padding:12px 14px;border-radius:12px}
.ch{transition:transform .15s}

#fw.shut #fb{display:none}#fw.shut .ch{transform:rotate(-90deg)}
#cc{padding:0}
.sb{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--th,96px) + var(--bt,0px) + var(--ch,0px));z-index:3;background:var(--sf);padding:4px 0 10px}
.sw{position:relative}.sw input{padding-right:38px}
.cx{position:absolute;right:4px;top:50%;transform:translateY(-50%);min-height:30px;width:30px;padding:0;border:0;background:none;color:var(--mu);border-radius:50%}
.cx[hidden]{display:none}
.lnk{border:0;background:none;padding:0;min-height:0;color:var(--pr);text-decoration:underline;font-weight:600;text-align:left}
.bar{fill:var(--pr)}.gl{stroke:var(--bd);stroke-width:1}.ax{fill:var(--mu);font-size:11px}
input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
#cc.shut #cb{display:none}#cc.shut .ch{transform:rotate(-90deg)}
.kpi.sel{border-color:var(--pr);box-shadow:0 0 0 1px var(--pr)}
button,select,input{font:inherit;color:var(--tx)}
button{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:9px 13px;cursor:pointer;min-height:40px}
button.p{background:var(--pr);color:var(--pt);border-color:var(--pr);font-weight:600}
button.on{background:var(--pr);color:var(--pt);border-color:var(--pr)}
button.d{color:var(--er)}
input,select{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:9px 10px;min-height:40px;width:100%}
label{display:block;font-size:13px;color:var(--mu);margin-bottom:3px}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
.sc{overflow-x:auto}
.cs{max-height:min(604px,34vh);overflow-y:auto}
#cw,#sp{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--th,96px));z-index:4;background:var(--bg);padding:10px 0 4px}
.cs th{position:sticky;top:0;background:var(--sf);z-index:1;box-shadow:0 1px 0 var(--bd)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--bd);vertical-align:middle}
th{font-size:12px;color:var(--mu);text-transform:uppercase;letter-spacing:.03em}
td input{min-width:70px;padding:6px 8px;min-height:34px}
.mu{color:var(--mu)}.ok{color:var(--ok)}.er{color:var(--er)}.wn{color:var(--wn)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cs2{position:fixed;left:0;right:0;bottom:0;max-height:60vh;overflow:auto;z-index:20;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));background:var(--bg);box-shadow:0 -4px 16px rgba(0,0,0,.25)}.cs2 .card{margin-bottom:0}
.st{display:inline-flex;align-items:center;gap:4px}.st button{min-width:40px;padding:0 10px;font-size:18px;font-weight:700;line-height:1}.st input{width:64px;text-align:center}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;max-width:90vw;z-index:9;display:none}
.tag{font-size:12px;border:1px solid var(--bd);border-radius:99px;padding:1px 8px}
</style>
</head>
<body>
<div id="top"><header>📦 Inventaris dan Penjualan</header>
<nav id="nav"></nav></div>
<main id="app"></main>
<div id="toast" role="status"></div>
<script>
"use strict";
const K="inv_penjualan_v1";
let S, mem=null, view="dash", cart=[], carts=[cart], ci=0, sel="", edit=null, panel=null, rtab="h", dl=null, q="", qty={}, dsel=null, delId=null, fopen=true, copen=true, bsub="brg", cid=null, pend=null, impMsg="", impMsgK="";
const $=i=>document.getElementById(i);
const val=i=>$(i).value.trim();
const num=i=>Number($(i).value||0);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const pd=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)};
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ymd(d)};
const mon=s=>addD(s,-((pd(s).getDay()+6)%7));
const today=()=>ymd(new Date());
const BLN=["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
const tgl=s=>{const d=pd(s);return d.getDate()+" "+BLN[d.getMonth()]+" "+d.getFullYear()};
const fresh=()=>({sistem:{tahun:new Date().getFullYear(),clean:""},kat:[],brg:[],rh:{},rm:{},rb:{},seq:1});
const SB_URL="https://ffxqdmtxdhygrvqlymhl.supabase.co",SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZmeHFkbXR4ZGh5Z3J2cWx5bWhsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU0MTUwODEsImV4cCI6MjExMDk5MTA4MX0.tfOQur1LGlMLsm5vVc1AiwCtFAr9l9Bh93eWi151hBU";
let ses=null,ver=0,pre=null;try{ses=JSON.parse(localStorage.getItem("sb_ses")||"null")}catch(e){}
const H=t=>({apikey:SB_KEY,Authorization:"Bearer "+(t||SB_KEY),"Content-Type":"application/json"});
function sx(m,p,b,t,h2){const x=new XMLHttpRequest();x.open(m,SB_URL+p,false);const h={...H(t),...h2};for(const k in h)x.setRequestHeader(k,h[k]);
  try{x.send(b?JSON.stringify(b):null)}catch(e){throw Error("Tidak ada koneksi internet. Transaksi belum berhasil.")}return x}
function setSes(r){ses={at:r.access_token,rt:r.refresh_token,exp:r.expires_at||Math.floor(Date.now()/1000)+r.expires_in,uid:(r.user&&r.user.id)||(ses&&ses.uid)};localStorage.setItem("sb_ses",JSON.stringify(ses))}
function tk(){if(!ses)throw Error("Sesi berakhir, muat ulang lalu masuk lagi");
  if(ses.exp-Date.now()/1000<90){const x=sx("POST","/auth/v1/token?grant_type=refresh_token",{refresh_token:ses.rt});if(x.status!==200)throw Error("Sesi berakhir, muat ulang lalu masuk lagi");setSes(JSON.parse(x.responseText))}return ses.at}
function load(){return pre}
function save(s){ // simpan ke server secara sinkron: sukses hanya jika server mengonfirmasi
  const x=sx("PATCH","/rest/v1/app_state?user_id=eq."+ses.uid+"&version=eq."+ver,{data:s,version:ver+1},tk(),{Prefer:"return=representation"});
  if(x.status>=300)throw Error("Gagal menyimpan ke server. Transaksi belum berhasil.");
  if(!JSON.parse(x.responseText).length)throw Error("Data diubah dari perangkat lain. Muat ulang halaman lalu ulangi.");ver++}
let nr=false; // true bila aksi gagal: tampilan tidak digambar ulang agar isian tidak hilang
function toast(m,c){if(c==="er")nr=true;const t=$("toast");t.textContent=m;t.style.display="block";t.style.background=c==="er"?"var(--er)":"var(--tx)";clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display="none",3200)}

/* ---- Logika bisnis: semua perubahan atomik (salin -> validasi -> terapkan -> simpan) ---- */
function tx(fn){const c=JSON.parse(JSON.stringify(S));try{fn(c);save(c);S=c;return true}catch(e){toast(e.message||"Gagal","er");return false}}
const kv=b=>b.multi?b.konv:1;
const unit=b=>b.multi?b.sk:b.sb;
const rp=n=>{const[a,b]=(Math.round((+n||0)*100)/100).toFixed(2).split(".");return "Rp "+a.replace(/\B(?=(\d{3})+(?!\d))/g,".")+","+b};
const pr=id=>{const v=Number($(id).value.replace(/[^\d,]/g,"").replace(",","."));return isNaN(v)?0:v};
const fmt=b=>b.multi?Math.floor(b.stok/b.konv)+" "+b.sb+" "+(b.stok%b.konv)+" "+b.sk:b.stok+" "+b.sb;
const kn=id=>(S.kat.find(k=>k.id===id)||{n:"-"}).n;
const fq=(id,q)=>{const b=S.brg.find(x=>x.id===+id);if(!b)return q;return b.multi?Math.floor(q/b.konv)+" "+esc(b.sb)+" "+(q%b.konv)+" "+esc(b.sk):q+" "+esc(b.sb)};
const sorted=l=>[...l].sort((a,b)=>kn(a.kat).localeCompare(kn(b.kat),"id")||a.nama.localeCompare(b.nama,"id"));
function keluar(c,id,q,d){
  const h=id+"|"+d,w=mon(d),m=id+"|"+w,y=+d.slice(0,4),mo=+d.slice(5,7),b=id+"|"+y+"|"+mo;
  (c.rh[h]=c.rh[h]||{b:id,t:d,q:0}).q+=q;
  (c.rm[m]=c.rm[m]||{b:id,t:w,e:addD(w,6),q:0}).q+=q;
  (c.rb[b]=c.rb[b]||{b:id,y,m:mo,q:0}).q+=q;
}
function retensi(c){const t=today(),lh=addD(t,-27),lw=addD(mon(t),-21);
  for(const k in c.rh)if(c.rh[k].t<lh)delete c.rh[k];
  for(const k in c.rm)if(c.rm[k].t<lw)delete c.rm[k];
  c.sistem.clean=t}
function tahunAktif(c){const y=new Date().getFullYear();
  if(c.sistem.tahun<y){c.rh={};c.rm={};c.rb={};c.sistem.tahun=y}} // reset tahunan: rekap dibersihkan, barang/kategori/harga/stok dipertahankan
const int=(v,n)=>{if(!Number.isInteger(v)||v<0)throw Error(n+" harus bilangan bulat 0 atau lebih")};

/* ---- Tampilan ---- */
const NAV=[["dash","Dashboard"],["jual","Penjualan"],["stok","Stok"],["brg","Barang"],["rekap","Rekap"],["sis","Sistem"]];
const sum=(o,f)=>Object.values(o).filter(f).reduce((a,x)=>a+x.q,0);
function jlist(){const s=q.trim().toLowerCase();
  const l=sorted(S.brg.filter(b=>b.aktif&&(!s||b.nama.toLowerCase().includes(s)||kn(b.kat).toLowerCase().includes(s))));
  return`<table><tr><th>Barang</th><th>Kategori</th><th>Satuan</th><th>Stok</th><th>Harga jual</th><th>Eceran</th><th>Jumlah besar</th><th>Jumlah kecil</th><th></th></tr>`
  +(l.map(x=>{const r=qty[x.id]||{b:0,k:0};return`<tr><td>${esc(x.nama)}</td><td>${esc(kn(x.kat))}</td><td>${x.multi?esc(x.sb)+" / "+esc(x.sk)+" ("+x.konv+")":esc(x.sb)}</td><td class="${x.stok===0?"wn":""}">${fmt(x)}</td><td>${rp(x.hj)}</td><td>${x.multi?rp(x.hje):"-"}</td>
  <td><span class="st"><button data-st="rb" data-d="-1" data-id="${x.id}" aria-label="Kurangi ${esc(x.sb)}">−</button><input type="number" min="0" value="${r.b}" data-c="rb" data-id="${x.id}" aria-label="Jumlah ${esc(x.sb)}"><button class="p" data-st="rb" data-d="1" data-id="${x.id}" aria-label="Tambah ${esc(x.sb)}">+</button></span> ${esc(x.sb)}</td>
  <td>${x.multi?`<span class="st"><button data-st="rk" data-d="-1" data-id="${x.id}" aria-label="Kurangi ${esc(x.sk)}">−</button><input type="number" min="0" value="${r.k}" data-c="rk" data-id="${x.id}" aria-label="Jumlah ${esc(x.sk)}"><button class="p" data-st="rk" data-d="1" data-id="${x.id}" aria-label="Tambah ${esc(x.sk)}">+</button></span> ${esc(x.sk)}`:"-"}</td>
  <td><button class="p" data-a="rowAdd" data-id="${x.id}">+ Keranjang</button></td></tr>`}).join("")||`<tr><td colspan="9" class="mu">${s?"Tidak ada barang yang cocok dengan pencarian.":"Belum ada barang aktif."}</td></tr>`)+`</table>`}
const F={brg:{q:"",s:"kat"},stok:{q:"",s:"kat"}};
const SORTN={kat:"Kategori A-Z",nama:"Nama A-Z",nama_d:"Nama Z-A",stok_d:"Stok terbanyak",stok_a:"Stok tersedikit",hj_d:"Harga jual tertinggi",hj_a:"Harga jual terendah"};
function vlist(k){const f=F[k],s=f.q.trim().toLowerCase();
  const n=(a,b)=>a.nama.localeCompare(b.nama,"id");
  const sb=x=>x.multi?Math.floor(x.stok/x.konv):x.stok,sk=x=>x.multi?x.stok%x.konv:0;
  const m={kat:(a,b)=>kn(a.kat).localeCompare(kn(b.kat),"id")||n(a,b),nama:n,nama_d:(a,b)=>n(b,a),stok_d:(a,b)=>sb(b)-sb(a)||sk(b)-sk(a)||n(a,b),stok_a:(a,b)=>sb(a)-sb(b)||sk(a)-sk(b)||n(a,b),hj_d:(a,b)=>b.hj-a.hj||n(a,b),hj_a:(a,b)=>a.hj-b.hj||n(a,b)};
  return S.brg.filter(b=>(!f.f||(b.aktif&&stat(b)===f.f))&&(!s||b.nama.toLowerCase().includes(s)||kn(b.kat).toLowerCase().includes(s))).sort(m[f.s]||m.kat)}
function toolbar(k){const f=F[k],o=k==="brg"?["kat","nama","nama_d","stok_d","stok_a","hj_d","hj_a"]:["kat","nama","nama_d","stok_d","stok_a"];
  return`<div class="sb">${k==="stok"?chips():""}<div class="f"><div><label>Cari</label>${srch("fq",f.q,"Nama barang atau kategori...",k)}</div>
  <div><label>Urutkan</label><select id="fs" data-k="${k}">${o.map(x=>`<option value="${x}" ${f.s===x?"selected":""}>${SORTN[x]}</option>`).join("")}</select></div></div></div>`}
function blist(){return`<table><tr><th>Barang</th><th>Kategori</th><th>Satuan</th><th>Stok</th><th>Harga beli</th><th>Harga jual</th><th>Eceran</th><th>Status</th><th></th></tr>
  ${vlist("brg").map(x=>`<tr><td>${esc(x.nama)}</td><td>${esc(kn(x.kat))}</td><td>${x.multi?esc(x.sb)+" / "+esc(x.sk)+" ("+x.konv+")":esc(x.sb)}</td><td>${fmt(x)}</td><td>${rp(x.hb)}</td><td>${rp(x.hj)}</td><td>${x.multi?rp(x.hje):"-"}</td><td class="${x.aktif?"ok":"mu"}">${x.aktif?"Aktif":"Nonaktif"}</td>
  <td class="row"><button data-a="brgEdit" data-id="${x.id}">Ubah</button><button data-a="brgTog" data-id="${x.id}">${x.aktif?"Nonaktifkan":"Aktifkan"}</button>${delId===x.id?`<span class="er">Hapus permanen?</span><button class="d" data-a="brgDelOk" data-id="${x.id}">Ya, hapus</button><button data-a="brgDelNo">Batal</button>`:`<button class="d" data-a="brgDel" data-id="${x.id}">Hapus</button>`}</td></tr>`).join("")||`<tr><td colspan="9" class="mu">${F.brg.q?"Tidak ada barang yang cocok dengan pencarian.":"Belum ada barang."}</td></tr>`}</table>`}
function slist(){return`<table><tr><th>Barang</th><th>Kategori</th><th>Besar</th><th>Kecil</th><th>Stok</th><th></th></tr>
  ${vlist("stok").map(x=>`<tr><td>${esc(x.nama)}${x.aktif?"":' <span class="tag">nonaktif</span>'}</td><td>${esc(kn(x.kat))}</td><td>${x.multi?Math.floor(x.stok/x.konv):x.stok} ${esc(x.sb)}</td><td>${x.multi?x.stok%x.konv+" "+esc(x.sk):"-"}</td><td class="${x.stok===0?"wn":""}"><b>${fmt(x)}</b></td>
  <td class="row"><button data-a="pAdd" data-id="${x.id}">+ Stok</button><button data-a="pKor" data-id="${x.id}">Koreksi</button></td></tr>`).join("")||`<tr><td colspan="6" class="mu">${F.stok.q||F.stok.f?"Tidak ada barang yang cocok dengan pencarian.":"Belum ada barang."}</td></tr>`}</table>`}
const avg=b=>b.mk&&b.mk.length?b.mk.reduce((a,x)=>a+x,0)/b.mk.length:0; // rata-rata 5 stok masuk terakhir (satuan besar)
const sbes=b=>b.multi?Math.floor(b.stok/b.konv):b.stok;
const nb=v=>String(Math.round(v*100)/100).replace(".",",");
const batas=b=>{const a=avg(b);return a<=0?0:a<=5?1:a<=20?2:a*0.1}; // rata-rata <=5: batas 1; <=20: batas 2; selain itu 10% rata-rata
const stat=b=>b.stok===0?"habis":(avg(b)>0&&sbes(b)<=batas(b)?"sedikit":"");
const srch=(id,v,ph,k)=>`<div class="sw"><input id="${id}" type="search" ${k?`data-k="${k}" `:""}placeholder="${ph}" value="${esc(v)}" autocomplete="off"><button class="cx" type="button" data-x="${id}" aria-label="Hapus pencarian" ${v?"":"hidden"}>✕</button></div>`;
function chart(){const b=S.brg.find(x=>x.id===cid);if(!b)return"";
  const t=today(),pts=[];
  if(rtab==="h")for(let i=27;i>=0;i--){const d=addD(t,-i),r=S.rh[cid+"|"+d];pts.push({l:d.slice(8)+"/"+d.slice(5,7),f:tgl(d),q:r?r.q:0})}
  else if(rtab==="m")for(let i=3;i>=0;i--){const w=addD(mon(t),-7*i),r=S.rm[cid+"|"+w];pts.push({l:w.slice(8)+"/"+w.slice(5,7),f:tgl(w)+" - "+tgl(addD(w,6)),q:r?r.q:0})}
  else{const y=S.sistem.tahun;for(let m=1;m<=12;m++){const r=S.rb[cid+"|"+y+"|"+m];pts.push({l:BLN[m-1],f:BLN[m-1]+" "+y,q:r?r.q:0})}}
  const W=640,H=260,L=48,R=10,T=18,B=36,pw=W-L-R,ph=H-T-B,mx=Math.max(1,...pts.map(p=>p.q));
  const ym=mx<4?mx:Math.ceil(mx/4)*4,nt=ym<4?ym:4,cw=pw/pts.length,bw=Math.min(cw*0.7,40),step=pts.length>12?4:1;

function okBackup(o){const bad="Isi file tidak sesuai format cadangan aplikasi ini";
  if(!o||typeof o!=="object"||!Array.isArray(o.kat)||!Array.isArray(o.brg)||!o.sistem||!Number.isInteger(o.sistem.tahun)||!Number.isInteger(o.seq))return bad;
  for(const k of["rh","rm","rb"])if(!o[k]||typeof o[k]!=="object"||Array.isArray(o[k]))return bad;
  const ids=new Set(),bi=new Set();
  for(const k of o.kat){if(!k||!Number.isInteger(k.id)||typeof k.n!=="string"||ids.has(k.id))return bad;ids.add(k.id)}
  for(const b of o.brg){if(!b||!Number.isInteger(b.id)||bi.has(b.id)||typeof b.nama!=="string"||typeof b.sb!=="string"||!ids.has(b.kat)||!Number.isInteger(b.stok)||b.stok<0||!Number.isInteger(b.konv)||b.konv<1||typeof b.multi!=="boolean")return bad;bi.add(b.id)}
  if([...ids,...bi].some(x=>x>=o.seq))return "Isi file tidak konsisten (nomor urut)";
  return ""}
